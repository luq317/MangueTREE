[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "manguetree"
version = "1.1.0"
description = "Streamlit app for mangrove forest structure analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
dependencies = [
    "streamlit",
    "pandas",
    "numpy",
    "openpyxl",
    "plotly",
    "unidecode",
    "matplotlib",
    "reportlab",
    "pillow",
    "kaleido",     # optional in practice: PDF charts identical to the app (needs Chrome/Chromium)
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
manguetree = "manguetree.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
manguetree = ["data/*", "data/fonts/*", "app/*.py", "app/pages/*.py", "app/assets/*", "app/assets/icons/*", "app/.streamlit/*", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pt_default: run the app test with the Portuguese default language"]
